<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GameZoney • Sessão finalizada</title><style>*{box-sizing:border-box}body{margin:0;background:#101115;color:#f3f4f7;font-family:Arial,sans-serif;text-align:center;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:5vh 7vw}.wrap{max-width:1050px;width:100%}.logo{height:150px;width:auto;max-width:min(560px,82vw);object-fit:contain;border-radius:16px}.brand{letter-spacing:4px;color:#a1a4b0;font-size:15px}h1{color:#ffce3a;font-size:clamp(32px,4vw,64px);text-transform:uppercase;letter-spacing:2px;margin:22px 0}h2{font-size:clamp(23px,2.5vw,40px);margin:20px 0 30px}.grid{display:flex;flex-wrap:wrap;justify-content:center;gap:16px}.cell{background:#1c1e25;border:1px solid #343640;border-radius:12px;width:calc(50% - 12px);padding:23px}.cell span{display:block;color:#a5a8b4;font-size:18px;margin-bottom:13px}.cell strong{font-size:clamp(23px,2.5vw,36px)}p{color:#a5a8b4;font-size:20px;margin-top:28px}#message{color:#ff6b72}#idle{position:fixed;top:0;left:0;right:0;bottom:0;background:#000 url(/tv-wallpaper.jpg) center center/cover no-repeat;opacity:0;-webkit-transition:opacity 1.2s;transition:opacity 1.2s;pointer-events:none}#idle.on{opacity:1}</style></head><body><div class="wrap"><img class="logo" src="/logo.jpg" alt="GameZoney"><div class="brand">OBRIGADO POR JOGAR COM A GENTE</div><h1>Sessão finalizada</h1><h2 id="name">Carregando resumo…</h2><div class="grid"><div class="cell"><span>Hora de início</span><strong id="start">—</strong></div><div class="cell"><span>Hora de término</span><strong id="finish">—</strong></div><div class="cell"><span>Tempo utilizado</span><strong id="used">—</strong></div><div class="cell"><span>Tempo restante</span><strong id="left">—</strong></div></div><p>Procure a recepção para recarregar suas horas.</p><p id="message"></p></div><div id="idle"></div><script>/* 1.3.5: o resumo fica 10 s na tela e depois entra o wallpaper (o tempo do cliente não fica exposto até a recepção liberar o console de novo) */(function(){var img=new Image();img.src='/tv-wallpaper.jpg';setTimeout(function(){document.getElementById('idle').className='on'},10000)})();</script><script>(function(){var match=/(?:\?|&)session=([^&]+)/.exec(location.search);if(!match){document.getElementById('name').textContent='GameZoney';document.getElementById('message').textContent='O resumo aparece ao encerrar uma sessão pelo servidor.';return}var key=encodeURIComponent(decodeURIComponent(match[1]));var xhr=new XMLHttpRequest();xhr.open('GET','/tv/session/'+key,true);xhr.onload=function(){if(xhr.status!==200){document.getElementById('message').textContent='Resumo indisponível. Consulte a recepção.';return}try{var s=JSON.parse(xhr.responseText);function time(t){return new Date(t).toLocaleString('pt-BR',{timeZone:s.timeZone})}function dur(n){n=Math.max(0,Math.floor(n||0));function pad(x){return x<10?'0'+x:String(x)}return pad(Math.floor(n/3600))+':'+pad(Math.floor(n/60)%60)+':'+pad(n%60)}if(s.organization){document.title=s.organization+' \u2022 Sessão finalizada';document.querySelector('.logo').alt=s.organization}document.getElementById('name').textContent='Nome do usuário: '+s.memberName;document.getElementById('start').textContent=time(s.startedAt);document.getElementById('finish').textContent=time(s.finishedAt);document.getElementById('used').textContent=dur(s.usedSeconds);document.getElementById('left').textContent=dur(s.remainingSeconds);var ack=new XMLHttpRequest();ack.open('POST','/tv/loaded/'+key,true);ack.send()}catch(e){document.getElementById('message').textContent='Não foi possível carregar o resumo.'}};xhr.onerror=function(){document.getElementById('message').textContent='Servidor indisponível. Consulte a recepção.'};xhr.send()})();</script></body></html>

<body>
<header class="topbar"><div class="wrap"><a class="logo" href="/"><img src="/logo-gamezoney.png" alt="GameZoney"></a><nav class="nav"><a href="/#recursos">Recursos</a><a href="/#precos">Preços</a><a href="/#duvidas">Dúvidas</a><a href="/guia" class="hidden" data-member>Guia</a><a href="/#novidades">Atualizações</a></nav></div></header>
<main class="page"><div class="wrap">
  <div class="box">
    <div class="tabs"><button type="button" data-tab="login" class="on">Entrar</button><button type="button" data-tab="register">Criar conta</button></div>
    <a class="btn google" id="google" href="/auth/google" style="margin-top:20px"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>Entrar com Google</a>
    <div class="or">ou com e-mail</div>
    <form id="login-form">
      <label>E-mail<input name="email" type="email" required autocomplete="email"></label>
      <label>Senha<input name="password" type="password" required autocomplete="current-password"></label>
      <button class="btn" style="width:100%;margin-top:20px">Entrar</button>
      <p style="text-align:center;margin:16px 0 0"><a href="#" id="forgot">Esqueci a senha</a></p>
    </form>
    <form id="register-form" class="hidden">
      <label>Nome<input name="name" required maxlength="100" autocomplete="name"></label>
      <label>E-mail<input name="email" type="email" required autocomplete="email"></label>
      <label>Senha (mínimo 8 caracteres)<input name="password" type="password" required minlength="8" autocomplete="new-password"></label>
      <button class="btn" style="width:100%;margin-top:20px">Criar conta e começar o teste</button>
      <p class="note" style="margin:14px 0 0">Ao criar a conta você aceita os <a href="/termos.html">Termos de uso</a> e a <a href="/privacidade.html">Política de privacidade</a>.</p>
    </form>
    <p class="msg" id="msg"></p>
  </div>
